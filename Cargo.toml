[workspace]
members = ["services/identity-server", "services/directory", "crates/grant-book", "crates/protocol-types", "crates/store", "crates/crypto", "crates/core", "crates/node", "crates/desktop-host", "crates/capabilities", "crates/mailbox-swarm", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/glebkudr/kaikichat"

[workspace.dependencies]
ed25519-dalek = "3.0.0"
hex = "0.4.3"
minicbor = { version = "2.3.0", features = ["std"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
fs2 = "0.4.3"
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
zeroize = "1.9.0"

openmls = "0.9.0"
openmls_traits = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"

# The owner CLI derives its secrets key on every call; keep it fast in tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# Signatures and hashes every holder receipt, stamp and document needs:
# unoptimized, they dominate the rig's scenarios.
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[patch.crates-io]
# Kad Reset must wake a sleeping inbound stream to release its handler slot.
# See vendor/libp2p-kad/README-PATCH.md.
libp2p-kad = { path = "vendor/libp2p-kad" }
