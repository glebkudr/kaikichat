# /privacy serves privacy.html; redirects stay relative behind the HTTPS proxy.
server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    # The app's signed network preset (scripts/network-preset.py): always
    # asked for again, so a new one reaches clients at once.
    location = /network.json {
        add_header Cache-Control "no-cache";
    }
    # The command line's installer and its builds (the chat-downloads
    # volume, filled by scripts/publish-cli.sh), read as text in a browser.
    location = /install.sh {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }
    location /downloads/ {
        add_header Cache-Control "no-cache";
    }
    location ~ \.sha256$ {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }
}
