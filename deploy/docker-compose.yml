# Coolify project "chat", environment "production": the Agentic Internet
# testnet's public nodes. Deployed by Coolify from the `main` branch with this
# file as the Docker Compose location; no port here overlaps the server's
# other projects. Coolify builds from the repository root (its base
# directory), so build contexts are relative to it; locally run
# `docker compose -f deploy/docker-compose.yml --project-directory . …`.
#
# `site`: kaikichat.com (Kaiki Chat), a static page and the app's signed
# network preset /network.json (scripts/network-preset.py); Coolify's proxy
# gives it HTTPS for the domain set on this service in Coolify.
#
# `identity`: id.kaikichat.com, the identity server that grants free coins
# after a Google or GitHub sign-in (services/identity-server). Its rules mirror
# the GrantIssuer of deployments/base-sepolia.json. ISSUER_KEY,
# GOOGLE_CLIENT_SECRET and GITHUB_CLIENT_SECRET are Coolify secrets; its
# database (the per-day grant serials, which account holds which grant, bans
# and revocations) is in the `chat-identity` volume and must never be
# restored to an earlier state.
#
# `directory`: directory.kaikichat.com, account discovery on port 8081.
# Its database lives in chat-directory; node 1 IPC is mounted read-only.
#
# `nodes`: ten mailbox holders (and bootstrap, DHT, AutoNAT and relay peers)
# on the host's network, node N on UDP and TCP port 4100+N. They read the
# Base Sepolia contracts of deployments/base-sepolia.json. Their routes and
# unit commitments are in /data/published.json of the `chat-nodes` volume.
# They report grants spent twice to the identity server and refuse the
# grants it revoked (Docs/V1_IDENTITY_PENALTIES_2026_09_30.md).
# The same container runs the network's welcome agent (deploy/node/welcome.py),
# its profile in /data/welcome; `welcome-kaiki` is `kaiki` for it, and its
# welcome.json is what the network preset's `welcome` names.
services:
  site:
    build:
      context: .
      dockerfile: deploy/site/Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    # The command line's builds, served at /downloads/ (scripts/publish-cli.sh).
    volumes:
      - chat-downloads:/usr/share/nginx/html/downloads:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  identity:
    build:
      context: .
      dockerfile: deploy/identity/Dockerfile
    expose:
      - "8080"
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      AIN_ID_LISTEN: "0.0.0.0:8080"
      AIN_ID_PUBLIC_URL: "https://id.kaikichat.com"
      AIN_ID_DOMAIN: "0xae2e3182ade817a3e726c29ef308eed15c6ec267ffc01a68da990e576fa0df18"
      AIN_ID_DATABASE: "/data/identity.db"
      # GrantIssuer 0x6710…850d: a book of 10000, 100000000 coins a day,
      # grants valid up to 30 days; one grant per account every 30 days.
      AIN_ID_BOOK_SIZE: "10000"
      AIN_ID_CAP_COINS: "100000000"
      AIN_ID_MAX_VALIDITY_DAYS: "30"
      AIN_ID_GRANT_VALIDITY_DAYS: "30"
      AIN_ID_CLAIM_INTERVAL_DAYS: "30"
      AIN_ID_GOOGLE_CLIENT_ID: "630672545352-vpuegdiua39ke8dpu2mldv63lf258c68.apps.googleusercontent.com"
      GITHUB_CLIENT_ID: "Ov23lioTFA6BO4tTRSF3"
      ISSUER_KEY: "${ISSUER_KEY}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
    volumes:
      - chat-identity:/data
    tmpfs:
      - /run/secrets
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  directory:
    build:
      context: .
      dockerfile: deploy/directory/Dockerfile
    expose:
      - "8081"
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      AIN_DIR_LISTEN: "0.0.0.0:8081"
      AIN_DIR_PUBLIC_URL: "https://directory.kaikichat.com"
      AIN_DIR_DOMAIN: "0xae2e3182ade817a3e726c29ef308eed15c6ec267ffc01a68da990e576fa0df18"
      AIN_DIR_DATABASE: "/data/directory.db"
      # The identity server's Google client, which lists this service's
      # callback too; its secret is the same Coolify variable.
      AIN_DIR_GOOGLE_CLIENT_ID: "630672545352-vpuegdiua39ke8dpu2mldv63lf258c68.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      # The directory's own GitHub OAuth app.
      GITHUB_CLIENT_ID: "Ov23ctwuNb3bpvjy9yhw"
      GITHUB_CLIENT_SECRET: "${DIRECTORY_GITHUB_CLIENT_SECRET}"
      DIRECTORY_KEY: "${DIRECTORY_KEY}"
      DIRECTORY_PEPPER: "${DIRECTORY_PEPPER}"
    volumes:
      - chat-directory:/data
      - type: volume
        source: chat-nodes
        target: /node
        read_only: true
        volume:
          subpath: directory
    tmpfs:
      - /run/secrets
    mem_limit: 256m
    depends_on:
      nodes:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nodes:
    build:
      context: .
      dockerfile: deploy/node/Dockerfile
    network_mode: host
    restart: unless-stopped
    # The welcome agent's daemon outlives the `kaiki` that started it.
    init: true
    environment:
      NODES: "10"
      BASE_PORT: "4101"
      PUBLIC_IP: "${PUBLIC_IP:-51.91.126.3}"
      CHAIN_RPC: "${CHAIN_RPC:-https://sepolia.base.org}"
      CHAIN_ID: "84532"
      BOOK_SHOP: "0x20d1013D45f2C99472df833293375A811BF1e406"
      GRANT_ISSUER: "0x6710BDeBb92c9D1D4c22f09aAB1305501e5b850d"
      REGISTRY: "0xCb3EFbf760293CE658c44f7D17bAb4Fb5d53CbB1"
      CHAIN_CONFIRMATIONS: "5"
      OPERATOR_POOL: "0x7B9e1DDEc7deb6ed69ef7f2E9c3ae9Ee924029Bc"
      IDENTITY_SERVER: "https://id.kaikichat.com"
    volumes:
      - chat-nodes:/data
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "test", "-s", "/data/published.json"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

volumes:
  chat-nodes:
  chat-identity:
  chat-directory:
  chat-downloads:
