[package]
name = "agentic-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[lib]
name = "agentic_desktop"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio-webdriver", "agentic-desktop-host/e2e"]

[dependencies]
agentic-desktop-host = {path="../../../crates/desktop-host"}
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-wdio-webdriver = {version="1.3.0",optional=true}
tokio = {version="1.53.1",features= ["sync", "time"] }
zeroize.workspace = true
[dev-dependencies]
tauri = {version="2.11.5",features= ["test"] }
tokio = {version="1.53.1",features= ["macros", "rt-multi-thread"] }
tempfile.workspace = true
zeroize.workspace = true
[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
[lints]
workspace = true
