<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080">
<title>Encrypted message delivery</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/MotionPathPlugin.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#091D18;color:#F0F5E9;font-family:"Helvetica Neue",sans-serif}
#root{position:relative;width:1920px;height:1080px;overflow:hidden}.world{position:absolute;inset:0;transform-origin:50% 52%}.base{width:1920px;height:1080px;position:absolute;inset:0}.network{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.route{fill:none;stroke:#B9F5CB;stroke-width:3;stroke-linecap:round;opacity:0}.backup{stroke:#FFD18B;stroke-width:4;stroke-dasharray:9 10}.route-tag{position:absolute;font:23px Menlo,monospace;color:#A7C3B3;opacity:0;letter-spacing:1px}
.packet{position:absolute;width:72px;height:56px;left:-36px;top:-28px;display:flex;align-items:center;justify-content:center;border:2px solid #B9F5CB;border-radius:12px;background:#123D2E;box-shadow:0 0 26px #B9F5CB66;opacity:0}.packet svg{width:25px;height:30px;color:#F0F5E9}.packet:after{content:"";width:14px;height:2px;background:#B9F5CB;box-shadow:0 7px #B9F5CB,0 -7px #B9F5CB;margin-left:7px}
.phone-message{position:absolute;left:188px;top:483px;width:165px;height:95px;border-radius:16px;background:#B9F5CB;color:#091D18;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;opacity:0}.phone-message strong{font-size:26px}.phone-message small{font-size:19px}.phone-message.destination{left:1555px}.secure-screen{background:#123D2E;color:#B9F5CB;border:1px solid #B9F5CB}.secure-screen svg{width:27px;height:32px}.secure-screen small{font:18px Menlo,monospace}
.endpoint{position:absolute;top:801px;width:320px;text-align:center;font-size:28px;opacity:0}.sender-label{left:110px}.receiver-label{left:1478px}.presence{position:absolute;left:1531px;top:416px;width:215px;text-align:center;font:20px Menlo,monospace;color:#FFD18B;opacity:0}.presence.online{color:#B9F5CB}
.store{position:absolute;width:250px;height:47px;border:1px solid #FFD18B;background:#243626;border-radius:24px;color:#FFD18B;display:flex;align-items:center;justify-content:center;gap:10px;font-size:23px;opacity:0}.store svg{width:19px;height:22px}.store-a{left:445px;top:422px}.store-e{left:1230px;top:654px}.store-f{left:1300px;top:798px}
.fault{position:absolute;width:44px;height:44px;border-radius:50%;background:#542E29;color:#FF8D7E;border:2px solid #FF8D7E;font:36px/38px sans-serif;text-align:center;opacity:0}.fault-a{left:930px;top:316px}.fault-e{left:1340px;top:519px}.fault-label{position:absolute;font-size:24px;color:#FF8D7E;opacity:0}.fault-label.a{left:886px;top:272px}.fault-label.e{left:1267px;top:475px}
.ring{position:absolute;width:186px;height:55px;border:3px solid #FFD18B;border-radius:50%;opacity:0}.ring-a{left:668px;top:339px}.ring-e{left:1065px;top:570px}.ring-f{left:1075px;top:807px}.confirm{position:absolute;left:1599px;top:601px;font-size:27px;color:#B9F5CB;opacity:0}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1920" data-height="1080">
<div class="world" data-layout-allow-overflow>
<img class="base" data-layout-ignore src="assets/network-base.png" alt="Two phones and six independent network nodes">
<svg class="network" data-layout-ignore viewBox="0 0 1920 1080" aria-label="Delivery routes">
<defs><symbol id="lock" viewBox="0 0 24 28"><path d="M6 12V8a6 6 0 0 1 12 0v4M4 12h16v14H4z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/><circle cx="12" cy="18" r="1.5" fill="currentColor"/><path d="M12 19v3" stroke="currentColor" stroke-width="2"/></symbol></defs>
<path id="sa" class="route" d="M370 538 C505 538 512 338 710 338"/><path id="sb" class="route" d="M370 538 L710 538"/><path id="sc" class="route" d="M370 538 C510 538 520 784 702 784"/>
<path id="ad" class="route" d="M810 338 L1096 338"/><path id="be" class="route" d="M810 538 L1101 538"/><path id="cf" class="route" d="M800 784 L1110 784"/>
<path id="dr" class="route" d="M1198 338 C1400 338 1400 538 1540 538"/><path id="er" class="route" d="M1205 538 L1540 538"/><path id="fr" class="route" d="M1210 784 C1390 784 1380 538 1540 538"/>
<path id="ab" class="route backup" d="M760 387 L760 489"/><path id="ef" class="route backup" d="M1156 593 L1162 732"/>
</svg>
<div class="route-tag" style="left:910px;top:383px">CHANNEL 01</div><div class="route-tag" style="left:910px;top:584px">CHANNEL 02</div><div class="route-tag" style="left:910px;top:830px">CHANNEL 03</div>
<div id="plain" class="phone-message"><strong>Hello!</strong><small>Message</small></div>
<div id="encrypted" class="phone-message secure-screen"><svg><use href="#lock"/></svg><small>8f 2a c9 7b</small></div>
<div id="received" class="phone-message destination secure-screen"><svg><use href="#lock"/></svg><small>8f 2a c9 7b</small></div>
<div id="decrypted" class="phone-message destination"><strong>Hello!</strong><small>Read</small></div>
<div class="endpoint sender-label">Sender</div><div class="endpoint receiver-label">Recipient</div>
<div id="offline" class="presence">● offline</div><div id="online" class="presence online">● online</div><div class="confirm">✓✓</div>
<div class="store store-a"><svg><use href="#lock"/></svg>Copy stored</div><div class="store store-e"><svg><use href="#lock"/></svg>Copy stored</div><div class="store store-f"><svg><use href="#lock"/></svg>Waiting to deliver</div>
<div class="ring ring-a"></div><div class="ring ring-e"></div><div class="ring ring-f"></div>
<div class="fault fault-a">×</div><div class="fault fault-e">×</div><div class="fault-label a">No connection</div><div class="fault-label e">Path unavailable</div>
<div id="packets"></div>
</div>

</div>
<script>
const ids=['p1','p2','p3','try1','hop1','hop2','try2','hop3','last','reserve'];
document.querySelector('#packets').innerHTML=ids.map(id=>`<div class="packet" id="${id}"><svg><use href="#lock"/></svg></div>`).join('');
window.__timelines=window.__timelines||{};
const timeline=gsap.timeline({paused:true});
window.__timelines.main=timeline;
const SPEED=2;
const timing=vars=>({...vars,...(vars.duration!==undefined?{duration:vars.duration/SPEED}:{}),...(typeof vars.stagger==='number'?{stagger:vars.stagger/SPEED}:{})});
// Scale timing when constructing tweens, preserving zero-duration position sets.
const tl={
 to:(target,vars,at)=>timeline.to(target,timing(vars),at/SPEED),
 from:(target,vars,at)=>timeline.from(target,timing(vars),at/SPEED),
 fromTo:(target,from,to,at)=>timeline.fromTo(target,from,timing(to),at/SPEED),
 set:(target,vars,at)=>timeline.set(target,vars,at/SPEED)
};
gsap.registerPlugin(MotionPathPlugin);
function along(id,path,t,d,tail){const el='#'+id;const shape=document.querySelector('#'+path).getAttribute('d')+(tail?' L'+tail.join(' '):'');show(el,t,.18);tl.to(el,{motionPath:{path:shape,autoRotate:false},duration:d,ease:'power1.inOut'},t);hide(el,t+d,.22)}
function show(el,t,d=.45){tl.fromTo(el,{opacity:0},{opacity:1,duration:d,ease:'sine.out',immediateRender:false},t)}
function hide(el,t,d=.3){tl.to(el,{opacity:0,duration:d,ease:'sine.in'},t)}
function move(id,points,t,d){const el='#'+id;tl.set(el,{x:points[0][0],y:points[0][1]},t);show(el,t,.18);for(let i=1;i<points.length;i++)tl.to(el,{x:points[i][0],y:points[i][1],duration:d/(points.length-1),ease:points.length===2?'power1.inOut':'none'},t+(i-1)*d/(points.length-1));hide(el,t+d,.22)}
function storeAt(name,t,end){show('.store-'+name,t);show('.ring-'+name,t);tl.to('.ring-'+name,{scale:1.12,duration:1.1,yoyo:true,repeat:Math.max(0,Math.floor((end-t)/1.1)-1),ease:'sine.inOut'},t);hide('.store-'+name,end);hide('.ring-'+name,end)}
tl.from('.world',{opacity:0,duration:1.25,ease:'sine.out'},.1);tl.to('.world',{scale:1.018,duration:43.7,ease:'none'},.2);
show('.endpoint',.8);show('#plain',1.3);hide('#plain',3.2);show('#encrypted',3.6);show('.route-tag',5.5);show('#offline',5.5);
tl.fromTo('.route:not(.backup)',{opacity:0},{opacity:.48,duration:.8,stagger:.07,ease:'sine.out',immediateRender:false},5.4);
along('p1','sa',6.4,2.9,[760,338]);move('p2',[[373,538],[760,538]],6.55,2.9);along('p3','sc',6.7,2.9,[752,784]);
move('try1',[[810,338],[925,338]],9.7,1.4);show('.fault-a',11.1);show('.fault-label.a',11.1);tl.to('#ad',{stroke:'#FF8D7E',opacity:.75,duration:.3},11.1);tl.to('#dr',{opacity:.12,duration:.4},11.1);
storeAt('a',11.3,19.3);move('hop1',[[810,538],[1156,538]],12.1,3.2);storeAt('e',15.4,27.1);
show('#ab',17.2);move('hop2',[[760,338],[760,538],[1156,538]],17.6,4.5);
move('try2',[[1205,538],[1330,538]],23.4,1.2);show('.fault-e',24.6);show('.fault-label.e',24.6);tl.to('#er',{stroke:'#FF8D7E',opacity:.75,duration:.3},24.6);
show('#ef',26);move('hop3',[[1156,538],[1162,784]],26.6,2.8);storeAt('f',29.4,32.1);
hide('#offline',30.2);show('#online',30.6);tl.to('#fr',{opacity:1,strokeWidth:5,duration:.5},31.4);move('reserve',[[800,784],[1162,784]],29.8,2);
along('last','fr',32.2,3.1,[1638,538]);
show('#received',35.2);hide('#received',36.3);show('#decrypted',36.7);show('.confirm',37.1);tl.to('#decrypted',{scale:1.04,duration:.6,yoyo:true,repeat:1,ease:'sine.inOut'},36.8);
</script></body></html>
