[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fuzz = { runs = 256 }

# Keep constructor failures at a real CREATE call depth. Dynamic linking replaces
# new with vm.deployCode and can end expectRevert tests after the first case.
dynamic_test_linking = false
